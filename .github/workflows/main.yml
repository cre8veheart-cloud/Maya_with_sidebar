name: MAYA verification

on:
  pull_request:
    branches:
      - main
      - recovery/restore-drive-archive-20261029
      - fix/cloudflare-workers-build
      - fix/claude-owner-access
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maya-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify the application
        run: npm run verify
      - name: Verify Cloudflare packaging without publishing
        run: npm run verify:cloudflare
      - name: Audit dependencies
        run: npm audit --audit-level=high
